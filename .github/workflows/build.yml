name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Create GILWEB2APPs Project
        run: |
          mkdir -p app/src/main/java/com/gil/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          cat > settings.gradle <<'EOF'
          rootProject.name = "GilApp"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.gil.app'
            compileSdk 35
            defaultConfig {
              applicationId "com.gil.app"
              minSdk 24
              targetSdk 35
              versionCode 1
              versionName "1.0"
            }
            compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
            buildTypes {
              release { minifyEnabled false }
              debug { minifyEnabled false }
            }
          }
          EOF
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">GILWEB2APPs</string></resources>
          EOF
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" /></resources>
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application android:allowBackup="true" android:label="@string/app_name" android:theme="@style/AppTheme">
              <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/gil/app/MainActivity.java <<'EOF'
          package com.gil.app;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          public class MainActivity extends Activity {
            private WebView w;
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              w = new WebView(this);
              setContentView(w);
              WebSettings s = w.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setLoadWithOverviewMode(true);
              s.setUseWideViewPort(true);
              w.setWebViewClient(new WebViewClient());
              w.loadUrl("https://example.com");
            }
            public void onBackPressed() {
              if (w.canGoBack()) { w.goBack(); } else { super.onBackPressed(); }
            }
          }
          EOF

      - name: Build APK and AAB
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          gradle bundleDebug --no-daemon --stacktrace
          echo "=== SIZE CHECK ==="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/bundle/debug/app-debug.aab
          APK_SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK bytes: $APK_SIZE"
          if [ "$APK_SIZE" -lt 1000000 ]; then echo "ERROR: APK too small, build is broken"; exit 1; fi
          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -n 30

      - name: Upload to Release - No Node Warning
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" --title "GILWEB2APPs Build $TAG" --notes "APK for testing, AAB for Play Console" || true
          gh release upload "$TAG" app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release upload "$TAG" app/build/outputs/bundle/debug/app-debug.aab --clobber
          echo "Done - check Releases tab"
